name: PFarma Media - Render organic week graphics

on:
  push:
    branches: [main]
    paths:
      - scripts/create-week-2026-10-26.py
      - .github/workflows/generate-week-2026-10-26.yml

permissions:
  contents: write

concurrency:
  group: pfarma-media-organic-week-2026-10-26
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install fixed rendering dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Render all branded 1080px PNG assets with safe CTA typography
        run: |
          set -euo pipefail
          python scripts/create-week-2026-10-26.py
          test "$(find media/week-2026-10-26 -name '*.png' -type f | wc -l)" -eq 9
      - name: Save immutable originals to public delivery repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pfarma-social-design[bot]"
          git config user.email "pfarma-social-design@users.noreply.github.com"
          git add media/week-2026-10-26/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: nine original branded PFarma feed and Story PNG creatives"
          for n in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$n" = 4 ]; then exit 1; fi
            sleep 3
          done
      - name: Ensure GitHub Pages serves main campaign creatives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          u="https://giovannifidel-collab.github.io/-pfarma-reel-media/media/week-2026-10-26/"
          for f in ("beauty-check-feed.png","unghie-feed.png","pulizia-viso-feed.png",
                    "sopracciglia-novembre-feed.png","sopracciglia-anteprima-story.png"):
              for n in range(80):
                  try:
                      with urlopen(Request(u+f,headers={"Range":"bytes=0-16"}),timeout=16) as r:
                          hdr=r.read(16)
                          if r.status in (200,206) and "image/png" in r.headers.get("Content-Type","").lower() and hdr[:4]==bytes([137,80,78,71]):
                              print("VERIFIED_PUBLIC_PNG",f)
                              break
                  except (HTTPError,URLError,TimeoutError,OSError): pass
                  time.sleep(5)
              else:
                  raise SystemExit("PUBLIC_PAGES_PNG_NOT_VERIFIED "+f)
          PY
